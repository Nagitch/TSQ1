[workspace]
members = [
    "crates/tsq1",
    "crates/tsq1-ffi",
    "crates/tsq1-osc",
    "tests/no-std",
    "tools/tsq1-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Nagitch/TSQ1"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
midly = { version = "0.5.3", default-features = false, features = ["alloc"] }
openformula-kernel = { git = "https://github.com/Nagitch/openformula-kernel.git", rev = "5448dcf6d130e4355da15aeed6c88e56a9a15673", default-features = false }
osc-codec-msgpack = "0.1.0-alpha.1"
osc-ir = { version = "0.1.0-alpha.1", features = ["osc11", "serde"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
