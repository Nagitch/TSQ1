[workspace]
members = [
    "crates/tsq1",
    "crates/tsq1-ffi",
    "tests/no-std",
    "tools/tsq1-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Nagitch/TSQ1"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
midly = { version = "0.5.3", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
