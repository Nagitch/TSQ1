version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /editors/vscode-tsq1
    # typescript-eslint 8.70 supports TypeScript <6.1. Revisit when its peer range expands.
    ignore:
      # Keep the API types compatible with engines.vscode.
      - dependency-name: "@types/vscode"
        versions: [">=1.126.0"]
      - dependency-name: typescript
        versions: [">=6.1"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      vscode-extension-dependencies:
        patterns:
          - "*"
